<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>#71099527 职位检索与收藏</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f0f2f5;color:#333}
.top-nav{background:#1a1a2e;color:#fff;padding:0 32px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.nav-brand{font-size:18px;font-weight:700}.nav-brand span{color:#4facfe}
.nav-links{display:flex;gap:24px}.nav-links a{color:rgba(255,255,255,0.8);font-size:14px;padding:6px 0;border-bottom:2px solid transparent}
.nav-links a:hover,.nav-links a.active{color:#fff;border-bottom-color:#4facfe}
.nav-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#4facfe,#00f2fe);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff}
.wrap{max-width:1200px;margin:0 auto;padding:24px 16px}
.title{font-size:22px;font-weight:700;margin-bottom:4px}
.sub{font-size:13px;color:#888;margin-bottom:24px}
.stats{display:flex;gap:16px;margin-bottom:20px}
.stat{flex:1;background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,0.05);display:flex;align-items:center;gap:12px}
.stat-num{font-size:28px;font-weight:700;color:#4facfe}.stat-num.red{color:#ff6b6b}
.stat-label{font-size:13px;color:#888}
.card{background:#fff;border-radius:12px;padding:24px;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,0.06)}
.card-title{font-size:15px;font-weight:600;margin-bottom:16px}
.filter-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:12px;color:#888}
.f input,.f select{height:38px;padding:0 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;outline:none}
.f input.w{width:260px}
.btn{height:38px;padding:0 20px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-p{background:linear-gradient(135deg,#4facfe,#00f2fe);color:#fff}
.btn-o{background:#fff;color:#4facfe;border:1px solid #4facfe}
.btn-sm{height:30px;padding:0 12px;font-size:12px}
.btn-collect{background:none;border:1px solid #ddd;color:#888}
.btn-collect.on{border-color:#ff6b6b;color:#ff6b6b;background:#fff5f5}
.res-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.res-count{font-size:13px;color:#888}
.job-item{background:#fff;border-radius:12px;padding:20px 24px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.05);display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border:1px solid transparent;transition:all .2s}
.job-item:hover{border-color:#4facfe}
.j-name{font-size:16px;font-weight:600;margin-bottom:4px}.j-company{font-size:13px;color:#666;margin-bottom:6px}.j-desc{font-size:12px;color:#999;line-height:1.5;margin-bottom:8px}
.tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:500;margin-right:6px}
.t-s{background:#e8f8ef;color:#27ae60}.t-l{background:#eef4ff;color:#4facfe}.t-e{background:#f5eef8;color:#9b59b6}.t-t{background:#f0f0f0;color:#666}
.empty{text-align:center;padding:48px;color:#aaa}
</style></head>
<body>
<nav class="top-nav"><div class="nav-brand"><span>锐聘</span> · 职位检索与收藏</div><div class="nav-links"><a href="#" class="active">职位检索</a></div><div style="display:flex;align-items:center;gap:8px;font-size:14px"><div class="nav-avatar">佟</div>佟乐</div></nav>
<div class="wrap">
  <div class="title">#71099527 职位检索与收藏</div>
  <div class="sub">Feature | 处理人：佟乐 | #71099528/#71099529/#71099532</div>
  <div class="stats">
    <div class="stat"><div><div class="stat-num">${DATA.length}</div><div class="stat-label">热门职位</div></div></div>
    <div class="stat"><div><div class="stat-num red" id="fav-count">0</div><div class="stat-label">我的收藏</div></div></div>
    <div class="stat"><div><div class="stat-num" style="color:#27ae60">${[...new Set(DATA.map(j=>j.location))].length}</div><div class="stat-label">覆盖城市</div></div></div>
  </div>
  <div class="card"><div class="card-title">筛选条件</div>
    <div class="filter-row">
      <div class="f"><label>关键词</label><input type="text" id="kw" class="w" placeholder="职位/公司/技能..."></div>
      <div class="f"><label>城市</label><select id="city"><option value="">全部</option></select></div>
      <div class="f"><label>薪资</label><select id="sal"><option value="">全部</option></select></div>
      <button class="btn btn-p" onclick="filterJobs()">🔍 搜索</button>
      <button class="btn btn-o" onclick="resetFilter()" style="margin-left:auto">重置</button>
    </div>
  </div>
  <div class="res-header"><span class="res-count" id="info"></span></div>
  <div id="list"></div>
</div>
<script>
const DATA=[
  {id:1,title:"前端开发工程师",company:"腾讯科技",location:"深圳",salary:"15-25K",exp:"3-5年",tags:["React","Vue","TS"],desc:"负责核心产品前端架构设计"},
  {id:2,title:"Java后端开发",company:"字节跳动",location:"北京",salary:"20-35K",exp:"3-5年",tags:["Spring Boot","MySQL"],desc:"推荐系统后端服务开发"},
  {id:3,title:"产品经理",company:"阿里巴巴",location:"杭州",salary:"18-30K",exp:"3-5年",tags:["数据分析","Axure"],desc:"电商产品规划与需求分析"},
  {id:4,title:"UI设计师",company:"网易游戏",location:"广州",salary:"12-20K",exp:"1-3年",tags:["Figma","Sketch"],desc:"游戏产品界面设计与交互优化"},
  {id:5,title:"数据分析师",company:"美团",location:"北京",salary:"15-28K",exp:"1-3年",tags:["Python","SQL"],desc:"业务数据分析与可视化报告"},
  {id:6,title:"运营专员",company:"京东集团",location:"北京",salary:"8-12K",exp:"应届",tags:["内容运营"],desc:"平台内容运营与用户增长"},
  {id:7,title:"测试工程师",company:"华为技术",location:"深圳",salary:"12-20K",exp:"1-3年",tags:["Selenium"],desc:"移动端应用自动化测试"},
  {id:8,title:"算法工程师",company:"商汤科技",location:"北京",salary:"25-45K",exp:"3-5年",tags:["PyTorch","AI"],desc:"AI视觉算法研发与优化"},
  {id:9,title:"DevOps",company:"滴滴出行",location:"北京",salary:"20-35K",exp:"3-5年",tags:["Docker","K8s"],desc:"容器化平台搭建与运维"},
  {id:10,title:"iOS开发",company:"哔哩哔哩",location:"上海",salary:"18-30K",exp:"3-5年",tags:["Swift"],desc:"B站iOS客户端功能开发"},
  {id:11,title:"安卓开发",company:"小红书",location:"上海",salary:"15-28K",exp:"1-3年",tags:["Kotlin"],desc:"小红书Android端核心模块"},
  {id:12,title:"全栈工程师",company:"快手",location:"北京",salary:"22-40K",exp:"3-5年",tags:["Node.js","Vue"],desc:"内部平台全栈开发"}
];
let favorites=JSON.parse(localStorage.getItem('fav_71099527')||'[]');
function isFav(id){return favorites.includes(id);}
function updateFavCount(){document.getElementById('fav-count').textContent=favorites.length;localStorage.setItem('fav_71099527',JSON.stringify(favorites));}
window.toggleFav=function(id,btn){
  const idx=favorites.indexOf(id);
  if(idx>-1){favorites.splice(idx,1);btn.className='btn btn-sm btn-collect';btn.textContent='☆ 收藏职位';}
  else{favorites.push(id);btn.className='btn btn-sm btn-collect on';btn.textContent='★ 已收藏';}
  updateFavCount();
};
function filterJobs(){
  const kw=document.getElementById('kw').value.trim().toLowerCase();
  const city=document.getElementById('city').value;
  const sal=document.getElementById('sal').value;
  const r=DATA.filter(j=>{
    if(kw&&!(j.title.toLowerCase().includes(kw)||j.company.toLowerCase().includes(kw)||j.tags.some(t=>t.toLowerCase().includes(kw))))return false;
    if(city&&j.location!==city)return false;
    if(sal&&j.salary!==sal)return false;return true;
  });
  document.getElementById('info').textContent=`找到 ${r.length} 个职位`;
  if(r.length===0){document.getElementById('list').innerHTML='<div class="empty">暂无匹配职位，请调整筛选条件</div>';return;}
  document.getElementById('list').innerHTML=r.map(j=>`
    <div class="job-item">
      <div><div class="j-name">${j.title}</div><div class="j-company">${j.company}</div><div class="j-desc">${j.desc}</div>
      <div style="margin-top:8px"><span class="tag t-s">${j.salary}</span><span class="tag t-l">${j.location}</span><span class="tag t-e">${j.exp}</span>${j.tags.map(t=>`<span class="tag t-t">${t}</span>`).join('')}</div></div>
      <button class="btn btn-sm btn-collect ${isFav(j.id)?'on':''}" data-id="${j.id}" onclick="toggleFav(${j.id},this)">☆ 收藏职位</button>
    </div>`).join('');
  updateFavCount();
}
function resetFilter(){document.getElementById('kw').value='';document.getElementById('city').value='';document.getElementById('sal').value='';filterJobs();}
[...new Set(DATA.map(j=>j.location))].forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;document.getElementById('city').appendChild(o);});
[...new Set(DATA.map(j=>j.salary))].forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;document.getElementById('sal').appendChild(o);});
filterJobs();
</script>
</body></html>
